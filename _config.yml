# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: My Tech Blog
author: Your Name
email: devopsmahadi@gmail.com
description: >-
  A modern blog about web development, programming, and technology.
  Sharing insights, tutorials, and experiences from the world of software development.

baseurl: "" # the subpath of your site, e.g. /blog
url: "https://devops-mahadi.github.io" # the base hostname & protocol for your site

# Social media usernames (without @ symbol)
twitter_username: yourusername
github_username: devops-mahadi
linkedin_username: yourusername
dev_username: yourusername

# Build settings
markdown: kramdown
permalink: /blog/:year/:month/:day/:title/

# Collections
collections:
  posts:
    output: true
    permalink: /blog/:year/:month/:day/:title/
  journal:
    output: true
    permalink: /journal/:year/:month/:day/:title/

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from processing
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md

# Pagination
paginate: 9
paginate_path: "/blog/page:num/"

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Your Name"
  - scope:
      path: ""
      type: "journal"
    values:
      layout: "journal"
      author: "Your Name"
  - scope:
      path: ""
    values:
      layout: "default"

# Reading Files
include:
  - _pages

# Conversion
highlighter: rouge

# Theme (comment out if using custom layouts)
# theme: minima
